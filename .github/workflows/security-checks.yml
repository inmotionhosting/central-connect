name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_VERSION: '1.173.0'
  CONFTEST_VERSION: '0.69.0'
  ACTIONLINT_VERSION: '1.7.12'

jobs:
  phpcs:
    name: PHPCS (WordPress + PHPCompatibilityWP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS
        run: bash bin/run-security-checks.sh phpcs

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      - name: Semgrep rules and fixtures
        run: bash bin/run-security-checks.sh semgrep

  conftest:
    name: Conftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Install Conftest
        run: |
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" "${base}/checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" conftest
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Conftest policies and fixtures
        run: bash bin/run-security-checks.sh conftest

  workflow-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      # install-wp-tests.sh is the upstream WP-CLI scaffold, kept verbatim.
      - name: shellcheck
        run: find bin -name '*.sh' ! -name install-wp-tests.sh -print0 | xargs -0 shellcheck
